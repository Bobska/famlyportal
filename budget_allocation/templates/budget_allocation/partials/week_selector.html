<div class="row mb-4">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body d-flex justify-content-between align-items-center">
        <a href="?week={{ prev_week.start_date|date:'Y-m-d' }}" class="btn btn-outline-secondary">
          <i class="fas fa-chevron-left me-1"></i>Previous Week
        </a>
        <div class="text-center">
          <h5 class="mb-1">Week of {{ current_week.start_date|date:"M d, Y" }}</h5>
          <p class="text-muted mb-0">{{ current_week.start_date|date:"M d" }} - {{ current_week.end_date|date:"M d, Y" }}</p>
        </div>
        <a href="?week={{ next_week.start_date|date:'Y-m-d' }}" class="btn btn-outline-secondary">
          Next Week<i class="fas fa-chevron-right ms-1"></i>
        </a>
      </div>
    </div>
  </div>
</div>
