<!-- Delete Confirmation Modal -->
<div class="modal" id="deleteExpenseModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-0">
                <p class="mb-3">Are you sure you want to delete this expense entry?</p>
                <div class="text-muted small" id="deleteExpenseDetails">
                    <!-- Will be populated with expense details (Merchant/Amount) -->
                </div>
                <input type="hidden" id="deleteExpenseId" value="">
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-secondary" id="confirmDeleteExpenseBtn">Delete</button>
            </div>
        </div>
    </div>
</div>
