<!-- Add Income Modal -->
<div class="modal" id="addIncomeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Income</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addIncomeForm">
                {% csrf_token %}
                <div class="modal-body">
                    <!-- Primary Fields - Main Focus -->
                    <div class="mb-3">
                        <label for="incomeDate" class="form-label fw-bold">Date</label>
                        <input type="date" class="form-control" id="incomeDate" name="date" required>
                        <div class="form-text">
                            <button type="button" id="autoDateIncome" class="btn btn-outline-secondary btn-sm p-1 text-decoration-none">
                                <i class="bi bi-magic"></i> Use auto date
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="incomePayeeSelect" class="form-label fw-bold">Payee</label>
                        <select class="form-select mb-2" id="incomePayeeSelect" name="payee_choice">
                            <option value="">Select existing payee...</option>
                        </select>
                        <div class="input-group">
                            <input type="text" class="form-control" id="incomePayee" name="payee" placeholder="Or enter new payee name...">
                            <button type="button" class="btn btn-outline-secondary" id="addPayeeIncomeBtn" title="Add to payee list">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                        <div class="form-text text-muted small">Select from existing or enter a new payee name</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="incomeAmount" class="form-label fw-bold">Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="text" class="form-control" id="incomeAmount" name="amount" placeholder="0.00" pattern="[\d,]+\.?\d{0,2}" required>
                        </div>
                    </div>
                    
                    <!-- Optional Notes - Less Prominent -->
                    <div class="mb-3">
                        <label for="incomeNotes" class="form-label text-muted small">Additional Notes (Optional)</label>
                        <textarea class="form-control form-control-sm" id="incomeNotes" name="notes" rows="2" placeholder="Optional details..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-secondary">Add Income</button>
                </div>
            </form>
        </div>
    </div>
</div>
