{% load humanize %}
<aside class="budget-basic-sidebar">
    <div class="sidebar-content">
        <!-- Quick Actions -->
        <div class="sidebar-section">
            <h6 class="sidebar-heading">Quick Actions</h6>
            <div class="d-grid gap-2">
                <button class="btn btn-outline-secondary btn-sm" onclick="showAddIncomeModal()">
                    Add Income
                </button>
                <button class="btn btn-outline-secondary btn-sm" onclick="showComingSoonModal()">
                    Add Expense
                </button>
            </div>
        </div>

        <!-- Budget Overview -->
        <div class="sidebar-section">
            <h6 class="sidebar-heading">This Month</h6>
            <div class="budget-summary">
                <div class="budget-item">
                    <span class="budget-label">Income:</span>
                    <span class="budget-value">${{ monthly_income|floatformat:2|intcomma }}</span>
                </div>
                <div class="budget-item">
                    <span class="budget-label">Expenses:</span>
                    <span class="budget-value">${{ monthly_expenses|floatformat:2|intcomma }}</span>
                </div>
                <hr class="my-2">
                <div class="budget-item">
                    <span class="budget-label">Balance:</span>
                    <span class="budget-value {% if monthly_balance < 0 %}text-danger{% elif monthly_balance > 0 %}text-success{% endif %}">${{ monthly_balance|floatformat:2|intcomma }}</span>
                </div>
            </div>
        </div>

        <!-- Recent Categories -->
        <div class="sidebar-section">
            <h6 class="sidebar-heading">Categories</h6>
            <div class="category-list">
                <div class="category-item">
                    <i class="fas fa-home me-2"></i>Housing
                </div>
                <div class="category-item">
                    <i class="fas fa-car me-2"></i>Transportation
                </div>
                <div class="category-item">
                    <i class="fas fa-utensils me-2"></i>Food
                </div>
                <div class="category-item">
                    <i class="fas fa-gamepad me-2"></i>Entertainment
                </div>
                <div class="category-item">
                    <i class="fas fa-ellipsis-h me-2"></i>Other
                </div>
            </div>
        </div>
    </div>
</aside>
