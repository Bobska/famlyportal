{% load static %}
<nav class="bb-top-nav navbar navbar-expand-lg navbar-light">
    <div class="bb-top-nav__container container-fluid">
        <div class="bb-top-nav__brand-group">
            <a class="bb-top-nav__brand" href="{% url 'budget_basic:dashboard' %}">
                <img src="{% static 'images/favicon.svg' %}" alt="FamlyPortal" width="28" height="28" class="bb-top-nav__brand-icon">
                <span class="bb-top-nav__brand-text">Budget Basic</span>
            </a>
            <button class="navbar-toggler bb-top-nav__toggler" type="button" data-bs-toggle="collapse" data-bs-target="#budgetBasicNavbar" aria-controls="budgetBasicNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <div class="collapse navbar-collapse bb-top-nav__collapse" id="budgetBasicNavbar">
            <ul class="navbar-nav bb-top-nav__links">
                {% with url_name=request.resolver_match.url_name %}
                    <li class="nav-item">
                        <a class="nav-link bb-top-nav__link {% if url_name == 'dashboard' %}is-active{% endif %}" href="{% url 'budget_basic:dashboard' %}" {% if url_name == 'dashboard' %}aria-current="page"{% endif %}>
                            <i class="fas fa-tachometer-alt"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link bb-top-nav__link {% if url_name == 'weekly' %}is-active{% endif %}" href="{% url 'budget_basic:weekly' %}" {% if url_name == 'weekly' %}aria-current="page"{% endif %}>
                            <i class="fas fa-calendar-week"></i>
                            <span>Weekly</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link bb-top-nav__link {% if url_name == 'transactions' %}is-active{% endif %}" href="{% url 'budget_basic:transactions' %}" {% if url_name == 'transactions' %}aria-current="page"{% endif %}>
                            <i class="fas fa-list"></i>
                            <span>Transactions</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link bb-top-nav__link {% if url_name == 'payee_list' %}is-active{% endif %}" href="{% url 'budget_basic:payee_list' %}" {% if url_name == 'payee_list' %}aria-current="page"{% endif %}>
                            <i class="fas fa-users"></i>
                            <span>Payees</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link bb-top-nav__link {% if url_name == 'category_list' %}is-active{% endif %}" href="{% url 'budget_basic:category_list' %}" {% if url_name == 'category_list' %}aria-current="page"{% endif %}>
                            <i class="fas fa-tags"></i>
                            <span>Categories</span>
                        </a>
                    </li>
                {% endwith %}
            </ul>

            <ul class="navbar-nav bb-top-nav__actions">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle bb-top-nav__user" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-user"></i>
                        <span>{{ user.get_full_name|default:user.username }}</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li>
                            <a class="dropdown-item" href="{% url 'accounts:dashboard' %}">
                                <i class="fas fa-home me-2"></i>Main Dashboard
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item" href="{% url 'accounts:profile' %}">
                                <i class="fas fa-user-cog me-2"></i>Profile
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="{% url 'accounts:logout' %}">
                                <i class="fas fa-sign-out-alt me-2"></i>Logout
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
