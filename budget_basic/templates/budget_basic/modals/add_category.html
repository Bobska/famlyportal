<!-- Add Category Modal - Stacked on top of other modals -->
<div class="modal" id="addCategoryModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addCategoryForm">
                {% csrf_token %}
                <div class="modal-body">
                    <!-- Alert container for category modal messages -->
                    <div id="addCategoryAlertContainer"></div>
                    
                    <div class="mb-3">
                        <label for="newCategoryName" class="form-label fw-bold">Name</label>
                        <input type="text" class="form-control" id="newCategoryName" name="name" placeholder="Enter category name..." required maxlength="100">
                        <div class="form-text text-muted small">This will be added to your category list for future use</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="newCategoryType" class="form-label fw-bold">Category Type</label>
                        <select class="form-select" id="newCategoryType" name="category_type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                            <option value="both">Both Income & Expense</option>
                        </select>
                        <div class="form-text text-muted small">Choose whether this category applies to income, expenses, or both</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="newCategoryDescription" class="form-label">Description (Optional)</label>
                        <textarea class="form-control form-control-sm" id="newCategoryDescription" name="description" rows="2" placeholder="Optional category description..." maxlength="500"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Category</button>
                </div>
            </form>
        </div>
    </div>
</div>
