{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Rajdhani', sans-serif;
        background: linear-gradient(135deg, #0a0d15 0%, #1a1d2e 100%);
        color: rgba(0, 217, 255, 0.9);
        overflow: hidden;
        height: 100vh;
    }
    /* Grid overlay */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: 
            linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
        z-index: 0;
    }
    .dashboard-container { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }
    /* TACTICAL HEADER */
    .tactical-header {
        background: linear-gradient(180deg, rgba(0, 217, 255, 0.1) 0%, rgba(0, 217, 255, 0.05) 100%);
        border-bottom: 2px solid rgba(0, 217, 255, 0.3);
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 20px rgba(0, 217, 255, 0.1);
    }
    .app-title { font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #00d9ff; text-shadow: 0 0 10px rgba(0, 217, 255, 0.5); }
    .page-subtitle { font-size: 12px; color: rgba(0, 217, 255, 0.6); text-transform: uppercase; letter-spacing: 1px; }
    .username { font-size: 14px; color: #00d9ff; font-weight: 600; }
    .user-role { font-size: 10px; color: rgba(0, 217, 255, 0.6); text-transform: uppercase; }
    .back-btn {
        display: inline-block; padding: 8px 20px;
        background: rgba(0, 217, 255, 0.1); border: 1px solid rgba(0, 217, 255, 0.3);
        color: #00d9ff; text-decoration: none;
        font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
        transition: all 0.3s ease;
    }
    .back-btn:hover { background: rgba(0, 217, 255, 0.2); border-color: rgba(0, 217, 255, 0.5); }
    /* MAIN 3-PANEL GRID */
    .main-grid { display: grid; grid-template-columns: 280px 1fr 280px; gap: 15px; flex: 1; overflow: hidden; padding: 15px; min-height: 0; }
    /* CENTER - NESTED GRID */
    .center-transactions-grid { display: grid; grid-template-columns: 1fr 400px; gap: 15px; overflow: hidden; }
    @media (min-width: 2000px) {
        .center-transactions-grid { grid-template-columns: 600px 400px 1fr; }
        .extended-stats-column { display: flex !important; }
    }
    /* PANELS */
    .tactical-panel {
        background: rgba(15, 20, 25, 0.95); border: 1px solid rgba(0, 217, 255, 0.3);
        position: relative; display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .corner-bl, .corner-br { position: absolute; width: 15px; height: 15px; border: 2px solid rgba(0, 217, 255, 0.5); }
    .corner-bl { bottom: 0; left: 0; border-top: none; border-right: none; }
    .corner-br { bottom: 0; right: 0; border-top: none; border-left: none; }
    .panel-header { background: rgba(0, 217, 255, 0.05); border-bottom: 1px solid rgba(0, 217, 255, 0.2); padding: 12px 20px; }
    .panel-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: #00d9ff; }
    .panel-content { flex: 1; overflow-y: auto; padding: 15px; }
    .panel-content::-webkit-scrollbar { width: 8px; }
    .panel-content::-webkit-scrollbar-track { background: rgba(0, 217, 255, 0.05); }
    .panel-content::-webkit-scrollbar-thumb { background: rgba(0, 217, 255, 0.2); border-radius: 4px; }
    /* FILTERS */
    .filter-group { margin-bottom: 20px; }
    .filter-label { font-size: 10px; color: rgba(0, 217, 255, 0.6); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
    .filter-input, .filter-select {
        width: 100%; background: rgba(0, 217, 255, 0.05); border: 1px solid rgba(0, 217, 255, 0.2);
        color: rgba(0, 217, 255, 0.9); padding: 8px 12px; font-family: 'Rajdhani', sans-serif;
        font-size: 13px; outline: none; transition: all 0.3s ease;
    }
    .filter-input:focus, .filter-select:focus { border-color: rgba(0, 217, 255, 0.5); background: rgba(0, 217, 255, 0.08); }
    .filter-btn {
        width: 100%; background: rgba(0, 217, 255, 0.1); border: 1px solid rgba(0, 217, 255, 0.3);
        color: #00d9ff; padding: 10px; cursor: pointer; font-family: 'Rajdhani', sans-serif;
        font-size: 12px; font-weight: 600; transition: all 0.3s ease;
        letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px;
    }
    .filter-btn:hover { background: rgba(0, 217, 255, 0.2); border-color: rgba(0, 217, 255, 0.5); }
    .filter-btn.primary { background: rgba(0, 255, 136, 0.15); border-color: rgba(0, 255, 136, 0.3); color: #00ff88; }
    /* TRANSACTIONS */
    .transaction-list { display: flex; flex-direction: column; gap: 8px; }
    .transaction-item {
        background: rgba(0, 217, 255, 0.03); border: 1px solid rgba(0, 217, 255, 0.15);
        padding: 12px; display: flex; align-items: center; gap: 12px;
        cursor: pointer; transition: all 0.3s ease;
    }
    .transaction-item:hover { background: rgba(0, 217, 255, 0.08); border-color: rgba(0, 217, 255, 0.3); }
    .transaction-item.selected { background: rgba(0, 217, 255, 0.15); border-color: rgba(0, 217, 255, 0.5); box-shadow: 0 0 15px rgba(0, 217, 255, 0.2); }
    .transaction-icon { font-size: 16px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .transaction-icon.income { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
    .transaction-icon.expense { background: rgba(255, 68, 68, 0.15); color: #ff4444; }
    .transaction-info { flex: 1; }
    .transaction-payee { font-size: 13px; color: #00d9ff; font-weight: 600; margin-bottom: 3px; }
    .transaction-date { font-size: 10px; color: rgba(0, 217, 255, 0.5); }
    .transaction-category { font-size: 9px; color: rgba(0, 217, 255, 0.6); text-transform: uppercase; }
    .transaction-amount { font-size: 14px; font-weight: 600; }
    .transaction-amount.income { color: #00ff88; }
    .transaction-amount.expense { color: #ff4444; }
    /* DETAILS */
    .detail-row { margin-bottom: 20px; }
    .detail-label { font-size: 10px; color: rgba(0, 217, 255, 0.6); text-transform: uppercase; margin-bottom: 5px; }
    .detail-value { font-size: 14px; color: #00d9ff; font-weight: 600; }
    .detail-value.large { font-size: 24px; }
    .detail-actions { display: flex; gap: 10px; margin-top: 30px; }
    .action-btn {
        flex: 1; padding: 10px; background: rgba(0, 217, 255, 0.1); border: 1px solid rgba(0, 217, 255, 0.3);
        color: #00d9ff; cursor: pointer; font-family: 'Rajdhani', sans-serif;
        font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
        transition: all 0.3s ease; text-decoration: none; text-align: center;
    }
    .action-btn:hover { background: rgba(0, 217, 255, 0.2); border-color: rgba(0, 217, 255, 0.5); }
    .action-btn.danger { background: rgba(255, 68, 68, 0.1); border-color: rgba(255, 68, 68, 0.3); color: #ff4444; }
    /* STATS */
    .stats-card { background: rgba(0, 217, 255, 0.03); border: 1px solid rgba(0, 217, 255, 0.2); padding: 15px; margin-bottom: 15px; }
    .stats-card-title { font-size: 11px; color: rgba(0, 217, 255, 0.6); text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(0, 217, 255, 0.15); }
    .stats-card-value { font-size: 24px; color: #00d9ff; font-weight: 600; margin-bottom: 5px; }
    .stats-card-label { font-size: 10px; color: rgba(0, 217, 255, 0.5); text-transform: uppercase; }
    .stats-mini-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(0, 217, 255, 0.1); }
    .stats-mini-item:last-child { border-bottom: none; }
    .stats-mini-label { font-size: 10px; color: rgba(0, 217, 255, 0.7); }
    .stats-mini-value { font-size: 11px; color: #00d9ff; font-weight: 600; }
    .extended-stats-column { display: none; }
    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state-icon { font-size: 48px; color: rgba(0, 217, 255, 0.3); margin-bottom: 20px; }
    .empty-state-title { font-size: 16px; color: #00d9ff; margin-bottom: 10px; }
    .empty-state-text { font-size: 11px; color: rgba(0, 217, 255, 0.6); }
</style>
{% endblock %}
