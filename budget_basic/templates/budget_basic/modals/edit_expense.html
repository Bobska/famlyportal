<!-- Edit Expense Modal -->
<div class="modal" id="editExpenseModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editExpenseForm">
                {% csrf_token %}
                <input type="hidden" id="editExpenseId" name="expense_id">
                <div class="modal-body">
                    <!-- Primary Fields - Main Focus -->
                    <div class="mb-3">
                        <label for="editExpenseDate" class="form-label fw-bold">Date</label>
                        <input type="date" class="form-control" id="editExpenseDate" name="date" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="editExpensePayeeSelect" class="form-label fw-bold">Merchant</label>
                        <select class="form-select mb-2" id="editExpensePayeeSelect" name="payee_choice">
                            <option value="">Select existing merchant...</option>
                        </select>
                        <div class="input-group">
                            <input type="text" class="form-control" id="editExpensePayee" name="payee" placeholder="Or enter new merchant name..." required>
                            <button type="button" class="btn btn-outline-secondary" id="addPayeeEditExpenseBtn" title="Add to merchant list">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                        <div class="form-text text-muted small">Select from existing or enter a new merchant name</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="editExpenseAmount" class="form-label fw-bold">Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="text" class="form-control" id="editExpenseAmount" name="amount" placeholder="0.00" pattern="[\d,]+\.?\d{0,2}" required>
                        </div>
                    </div>
                    
                    <!-- Optional Notes - Less Prominent -->
                    <div class="mb-3">
                        <label for="editExpenseNotes" class="form-label text-muted small">Additional Notes (Optional)</label>
                        <textarea class="form-control form-control-sm" id="editExpenseNotes" name="notes" rows="2" placeholder="Optional details..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-secondary">Update Expense</button>
                </div>
            </form>
        </div>
    </div>
</div>
