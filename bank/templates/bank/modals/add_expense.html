<!-- Add Expense Modal -->
<div class="modal" id="addExpenseModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addExpenseForm">
                {% csrf_token %}
                <div class="modal-body">
                    <!-- Primary Fields - Main Focus -->
                    <div class="mb-3">
                        <label for="expenseDate" class="form-label fw-bold">Date</label>
                        <input type="date" class="form-control" id="expenseDate" name="date" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="expensePayeeSelect" class="form-label fw-bold">Merchant</label>
                        <select class="form-select" id="expensePayeeSelect" name="payee_choice" required>
                            <option value="">Select existing merchant...</option>
                        </select>
                        <div class="d-grid mt-2">
                            <button type="button" class="btn btn-outline-primary btn-sm" id="addNewPayeeExpenseBtn">
                                <i class="bi bi-plus-lg me-1"></i> Add New Merchant
                            </button>
                        </div>
                        <div class="form-text text-muted small mt-2">Select from existing merchants or use the button above to add a new one</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="expenseAmount" class="form-label fw-bold">Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="text" class="form-control" id="expenseAmount" name="amount" placeholder="0.00" pattern="[\d,]+\.?\d{0,2}" required>
                        </div>
                    </div>
                    
                    <!-- Optional Notes - Less Prominent -->
                    <div class="mb-3">
                        <label for="expenseNotes" class="form-label text-muted small">Additional Notes (Optional)</label>
                        <textarea class="form-control form-control-sm" id="expenseNotes" name="notes" rows="2" placeholder="Optional details..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-secondary">Add Expense</button>
                </div>
            </form>
        </div>
    </div>
</div>
