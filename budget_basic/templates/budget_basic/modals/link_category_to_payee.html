<!-- Link Category to Payee Modal -->
<div class="modal" id="linkCategoryToPayeeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Link Category to <span id="linkPayeeName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="linkCategoryToPayeeForm">
                {% csrf_token %}
                <input type="hidden" id="linkPayeeId" name="payee_id">
                <div class="modal-body">
                    <!-- Search/Filter Categories -->
                    <div class="mb-3">
                        <label for="categorySearchInput" class="form-label text-muted small">Search Categories</label>
                        <input type="text" class="form-control form-control-sm" id="categorySearchInput" placeholder="Type to filter...">
                    </div>
                    
                    <!-- Categories List -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Categories to Link</label>
                        <div id="linkCategoriesList" class="border rounded p-3" style="max-height: 300px; overflow-y: auto;">
                            <!-- Categories will be loaded here dynamically -->
                            <div class="text-center text-muted py-3">
                                <div class="spinner-border spinner-border-sm" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <div class="small mt-2">Loading categories...</div>
                            </div>
                        </div>
                        <div class="form-text text-muted small mt-2">
                            <i class="bi bi-info-circle"></i> Select one or more categories to associate with this merchant
                        </div>
                    </div>
                    
                    <!-- Quick Add New Category -->
                    <div class="border-top pt-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <span class="small text-muted">Don't see the category you need?</span>
                            <button type="button" class="btn btn-sm btn-outline-primary" id="quickAddCategoryBtn">
                                <i class="bi bi-plus-circle"></i> Create New Category
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="linkCategoriesBtn">
                        <i class="bi bi-link-45deg"></i> Link Selected
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
